# Template only. Obtain your own authorized tunnel and runtime key.
control_plane:
  base_url: https://api.openai.com
  tunnel_id: REPLACE_WITH_YOUR_TUNNEL_ID
  api_key: env:CONTROL_PLANE_API_KEY
health:
  listen_addr: 127.0.0.1:0
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  stdio_send_initialized_notification: true
  commands:
    - channel: main
      command: 'cmd /c node "C:/YOUR/INSTALL/PATH/dc-preview-lab/full-server.mjs" candidate full-state'
